name = "qimen-api"
main = "src/index.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "api.qimenbazi.cn", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "qimen"
database_id = "d60c4fee-6b2a-4fc0-8015-d3d74c18e557"

[vars]
AFDIAN_USER_ID = "ce5512ded87411f1a31d52540025c377"
AFDIAN_PLAN_ID = "11fed06ed8f311f1ba875254001e7c00"
ALLOWED_ORIGIN = "https://qimenbazi.cn"
# P1-0 实测后填写并启用，绝不猜测退款状态或付款时间字段。
AFDIAN_VERIFIED = "false"
AFDIAN_REFUND_STATUS = ""
AFDIAN_PAID_AT_FIELD = ""

[triggers]
crons = ["0 19 * * *"]
